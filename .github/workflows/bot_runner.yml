name: Run Telegram Bot 24/7

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *' # Автоматический перезапуск каждые 6 часов для обхода лимитов

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pyTelegramBotAPI google-genai firebase-admin httpx
    - name: Start Bot with Automated Loop
      env:
        BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
        GEM_TOKEN: ${{ secrets.GEM_TOKEN }}
        FIREBASE_KEY_CONTENT: ${{ secrets.FIREBASE_KEY_CONTENT }}
      run: |
        # Запускаем фоновый таймер, который мягко завершит процесс через 5 часов 40 минут (20400 сек)
        # Это не даст GitHub принудительно оборвать воркфлоу на 6-м часе
        PID=$$
        (sleep 20400 && echo "Время воркфлоу на исходе, мягкая перезагрузка..." && kill -INT $PID) &

        echo "Запуск бота в режиме бесконечного авторестарта..."
        
        # Бесконечный цикл: если бот упадет от сетевой ошибки API или таймаута, он сразу поднимется сам
        while true; do
          python Bot.py
          echo "Бот упал или был остановлен. Перезапуск через 5 секунд..."
          sleep 5
        done
