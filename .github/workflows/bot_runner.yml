name: Run Telegram Bot 24/7
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Перезапуск каждые 6 часов, чтобы обойти лимиты GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-env: '3.11'

    - name: Install dependencies
      run: |
        pip install pyTelegramBotAPI google-genai firebase-admin httpx

    - name: Start Bot
      env:
        BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
        GEM_TOKEN: ${{ secrets.GEM_TOKEN }}
        FIREBASE_KEY_CONTENT: ${{ secrets.FIREBASE_KEY_CONTENT }}
      run: python Bot.py
