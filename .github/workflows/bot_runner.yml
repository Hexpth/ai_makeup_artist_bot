name: Run Telegram Bot 24/7

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *' # Автоматический перезапуск каждые 6 часов для обхода лимитов

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Create system prompt file
      run: echo "${{ secrets.SYSTEM_PROMPT }}" > system_prompt.txt
      
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pyTelegramBotAPI google-genai firebase-admin httpx
    - name: Start Bot with Automated Loop
      env:
        BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
        GEM_TOKEN: ${{ secrets.GEM_TOKEN }}
        FIREBASE_KEY_CONTENT: ${{ secrets.FIREBASE_KEY_CONTENT }}
      run: |
        # Мягко завершаем этот воркфлоу через 5 часов 30 минут (19800 сек),
        # чтобы управление перешло к следующему плановому запуску cron
        PID=$$
        (sleep 19800 && echo "Перезагрузка по расписанию..." && kill -INT $PID) &

        echo "Запуск бота в GitHub Actions..."
        python Bot.py

